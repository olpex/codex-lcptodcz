name: Journal Auto Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: journal-auto-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger journal and Drive processing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://codex-lcptodcz.vercel.app' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi

          url="${APP_BASE_URL%/}/api/api/v1/journal-monitors/auto-cron"
          echo "Triggering journal auto cron at ${url}"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --max-time 240 \
            --retry 2 \
            --retry-all-errors \
            --request POST "${url}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json"
